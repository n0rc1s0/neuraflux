<!DOCTYPE html>
<html lang="it" id="html-root" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Nextly — Professional AI Builder</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --mint: #4ECDC4; --lavender: #9B8FE8; --coral: #FF6B6B;
            --grad: linear-gradient(135deg, var(--mint) 0%, var(--lavender) 100%);
            --bg: #F8F7F4; --bg2: #FFFFFF; --bg3: #F1F0EC;
            --text: #1A1A2E; --text2: #6B6B80; --border: #E8E5DF;
            --radius: 20px;
        }
        [data-theme="dark"] {
            --bg: #0F0F14; --bg2: #16161F; --bg3: #1E1E2A;
            --text: #F0EEF8; --text2: #9090A8; --border: #2A2A3A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: 0.3s; }
        .display { font-family: 'Syne', sans-serif; font-weight: 800; }
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); }
        
        /* Sidebar & Navigation */
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: var(--text2); cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background: var(--bg3); color: var(--mint); }
        .nav-item.active { background: rgba(78, 205, 196, 0.1); color: var(--mint); }

        /* Chat System */
        .msg-fluxy { background: var(--bg3); padding: 16px; border-radius: 20px 20px 20px 4px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.6; max-width: 88%; align-self: flex-start; border: 1px solid var(--border); }
        .msg-user { background: var(--grad); color: white; padding: 16px; border-radius: 20px 20px 4px 20px; margin-bottom: 12px; font-size: 13.5px; max-width: 88%; align-self: flex-end; box-shadow: 0 4px 15px rgba(155, 143, 232, 0.2); }
        
        /* Modali (Logica NeuraFlux v4.4) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Fluxy Character */
        .fluxy-avatar { width: 45px; height: 45px; background: #E0F7F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .excited #eyes-normal { display: none; }
        .excited #eyes-happy { display: block; }
        #eyes-happy { display: none; }

        /* Bottoni */
        .btn { padding: 12px 24px; border-radius: 99px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--grad); color: white; }
        .btn-secondary { background: var(--bg3); color: var(--text); }

        /* Preview Area */
        #preview-wrap { position: relative; flex: 1; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .skel-loader { position: absolute; inset: 0; background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; z-index: 10; display: none; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

<div id="settings-modal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="card modal-content p-8">
        <h2 class="display text-2xl mb-2">Impostazioni</h2>
        <p class="text-sm text-gray-400 mb-6">Personalizza la tua esperienza con Nextly.</p>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase mb-2">Nome Progetto</label>
                <input id="set-proj-name" type="text" class="w-full p-3 card bg-gray-50 outline-none border-mint/20 focus:border-mint">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase mb-2">Supabase Anon Key</label>
                <input id="set-sb-key" type="password" class="w-full p-3 card bg-gray-50 outline-none">
            </div>
            <button class="btn btn-primary w-full justify-center" onclick="saveSettings()">Salva Configurazioni</button>
        </div>
    </div>
</div>

<div id="templates-modal" class="modal" onclick="if(event.target===this) closeTemplates()">
    <div class="card modal-content p-8 max-w-4xl">
        <h2 class="display text-2xl mb-6 text-center">Libreria Template</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="template-grid">
            </div>
    </div>
</div>

<div class="flex h-screen p-3 gap-3">
    <aside class="card w-64 p-5 flex flex-col gap-6">
        <div class="flex items-center gap-3 px-2">
            <svg width="32" height="32" viewBox="0 0 100 100" class="fluxy-avatar">
                <circle cx="50" cy="50" r="45" fill="url(#g)" />
                <defs><linearGradient id="g"><stop stop-color="#4ECDC4"/><stop offset="1" stop-color="#9B8FE8"/></linearGradient></defs>
                <path d="M30 50 Q50 20 70 50" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <h1 class="display text-xl tracking-tight">nextly</h1>
        </div>

        <nav class="flex flex-col gap-1">
            <div class="nav-item active" onclick="showSection('builder')"><i data-lucide="layout"></i> Builder</div>
            <div class="nav-item" onclick="openTemplates()"><i data-lucide="layers"></i> Templates</div>
            <div class="nav-item" onclick="openSettings()"><i data-lucide="settings"></i> Impostazioni</div>
            <div class="nav-item" onclick="openFeedback()"><i data-lucide="message-square"></i> Feedback</div>
        </nav>

        <div class="mt-auto pt-4 border-t border-border">
            <p class="text-[10px] font-bold text-gray-400 uppercase mb-3 tracking-widest">Time Machine</p>
            <div id="history-list" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-2"></div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col gap-3">
        <header class="card h-16 flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <div class="bg-mint/10 text-mint p-2 rounded-lg"><i data-lucide="terminal" size="18"></i></div>
                <input id="main-project-name" class="display bg-transparent border-none outline-none text-sm" value="Progetto Senza Nome">
            </div>
            <div class="flex items-center gap-3">
                <div class="flex bg-bg3 p-1 rounded-full border border-border">
                    <button class="p-2 rounded-full hover:bg-white" onclick="resizePreview('mobile')"><i data-lucide="smartphone" size="16"></i></button>
                    <button class="p-2 rounded-full hover:bg-white" onclick="resizePreview('desktop')"><i data-lucide="monitor" size="16"></i></button>
                </div>
                <button class="btn btn-primary py-2" onclick="openDeploy()"><i data-lucide="rocket"></i> Deploy</button>
            </div>
        </header>

        <div class="flex-1 flex gap-3 min-h-0">
            <section class="card w-[400px] flex flex-col overflow-hidden">
                <div class="p-4 border-b border-border flex items-center gap-3 bg-white/50">
                    <div class="fluxy-avatar" id="fluxy-ui-icon">
                        <svg viewBox="0 0 100 100" width="28">
                            <circle cx="50" cy="50" r="40" fill="#4ECDC4" />
                            <g id="eyes-normal"><circle cx="35" cy="45" r="5" fill="white"/><circle cx="65" cy="45" r="5" fill="white"/></g>
                            <g id="eyes-happy"><path d="M30 45 Q35 35 40 45" stroke="white" stroke-width="4" fill="none"/><path d="M60 45 Q65 35 70 45" stroke="white" stroke-width="4" fill="none"/></g>
                            <path d="M40 65 Q50 75 60 65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>
                        <p class="font-bold text-sm">Fluxy</p>
                        <p class="text-[10px] text-mint font-bold uppercase">AI Expert</p>
                    </div>
                </div>

                <div id="chat-flow" class="flex-1 overflow-y-auto p-5 flex flex-col">
                    </div>

                <div class="p-4 bg-gray-50/50 border-t border-border">
                    <div class="relative">
                        <textarea id="user-input" rows="1" placeholder="Cosa costruiamo oggi?" 
                            class="w-full p-4 pr-14 card border-none shadow-sm focus:ring-2 ring-mint/30 outline-none resize-none text-sm"></textarea>
                        <button onclick="handleMainSend()" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-grad text-white rounded-xl flex items-center justify-center shadow-lg hover:scale-105 transition">
                            <i data-lucide="send-horizontal" size="18"></i>
                        </button>
                    </div>
                </div>
            </section>

            <section id="preview-wrap" class="card">
                <div id="skel-loader" class="skel-loader"></div>
                <iframe id="main-preview" class="w-full h-full border-none"></iframe>
            </section>
        </div>
    </main>
</div>

<script>
    // Parte 1 finisce qui: la struttura HTML e il CSS sono pronti. 
    // Lucide init
    lucide.createIcons();
</script>
<script>
    // ── CONFIGURAZIONE E STATO ────────────────────────────────────────
    const CONFIG = {
        SB_URL: "https://vostra_url.supabase.co", // Inserisci la tua URL
        SB_KEY: "vostra_anon_key",              // Inserisci la tua Anon Key
        IS_LOADING: false,
        THEME: 'light'
    };

    let state = {
        projectName: localStorage.getItem('nx_proj_name') || "Nuovo Progetto Nextly",
        currentCode: localStorage.getItem('nx_last_code') || "",
        versions: JSON.parse(localStorage.getItem('nx_versions')) || [],
        chatHistory: [] // Memoria per Gemini
    };

    // Inizializzazione al caricamento
    window.addEventListener('load', () => {
        document.getElementById('main-project-name').value = state.projectName;
        if(state.currentCode) updatePreview(state.currentCode);
        renderHistory();
        appendMessage('fluxy', "Bentornato! Sono **Fluxy**. Su cosa lavoriamo oggi? Posso creare landing page, dashboard o intere web app.");
    });

    // ── GESTIONE CHAT E AI ───────────────────────────────────────────
    async function handleMainSend() {
        const input = document.getElementById('user-input');
        const prompt = input.value.trim();
        if (!prompt || CONFIG.IS_LOADING) return;

        // UI: Messaggio utente e blocco input
        appendMessage('user', prompt);
        input.value = "";
        setUIState(true);

        try {
            // Chiamata alla Serverless Function su Vercel (/api/generate.mjs)
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: prompt,
                    currentCode: state.currentCode,
                    history: state.chatHistory.slice(-4) // Invia gli ultimi 4 messaggi per contesto
                })
            });

            if (!response.ok) throw new Error("Errore risposta API");

            const data = await response.json();

            if (data.code) {
                state.currentCode = data.code;
                state.chatHistory.push({ role: 'user', content: prompt });
                state.chatHistory.push({ role: 'assistant', content: data.text });
                
                updatePreview(data.code);
                appendMessage('fluxy', data.text || "Ecco gli aggiornamenti richiesto!");
                saveVersion(prompt);
                
                // Log su Supabase (Tua logica originale)
                logActivity(prompt, "Successo");
                
                // Effetto coriandoli se la generazione è andata bene
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            }
        } catch (err) {
            console.error(err);
            appendMessage('fluxy', "Scusami, ho avuto un problema di connessione. Verifica che la `GEMINI_KEY` sia configurata correttamente su Vercel.");
            logActivity(prompt, "Errore: " + err.message);
        } finally {
            setUIState(false);
        }
    }

    // ── SUPABASE LOGGING ────────────────────────────────────────────
    async function logActivity(p, status) {
        try {
            await fetch(`${CONFIG.SB_URL}/rest/v1/generazioni`, {
                method: 'POST',
                headers: {
                    'apikey': CONFIG.SB_KEY,
                    'Authorization': `Bearer ${CONFIG.SB_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    progetto: state.projectName,
                    prompt: p,
                    stato: status,
                    timestamp: new Date().toISOString()
                })
            });
        } catch (e) { console.warn("Supabase log non disponibile"); }
    }

    // ── TIME MACHINE (VERSIONAMENTO) ────────────────────────────────
    function saveVersion(prompt) {
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const newVersion = {
            id: Date.now(),
            time: timestamp,
            name: prompt.substring(0, 25) + "...",
            code: state.currentCode
        };
        
        state.versions.unshift(newVersion);
        if (state.versions.length > 20) state.versions.pop(); // Limite 20 versioni
        
        localStorage.setItem('nx_versions', JSON.stringify(state.versions));
        localStorage.setItem('nx_last_code', state.currentCode);
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-list');
        container.innerHTML = state.versions.map(v => `
            <button onclick="restoreVersion(${v.id})" class="v-chip animate-in">
                <div class="flex justify-between items-center">
                    <span class="font-bold">v. ${v.time}</span>
                    <i data-lucide="history" size="10"></i>
                </div>
                <div class="text-[9px] opacity-60 truncate">${v.name}</div>
            </button>
        `).join('');
        lucide.createIcons();
    }

    function restoreVersion(id) {
        const v = state.versions.find(x => x.id === id);
        if (!v) return;
        state.currentCode = v.code;
        updatePreview(v.code);
        appendMessage('fluxy', `Time Machine: Ho ripristinato la versione delle **${v.time}**.`);
    }

    // ── INTERFACCIA UTILS ───────────────────────────────────────────
    function updatePreview(code) {
        const iframe = document.getElementById('main-preview');
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
    }

    function setUIState(loading) {
        CONFIG.IS_LOADING = loading;
        const fluxy = document.getElementById('fluxy-ui-icon');
        const loader = document.getElementById('skel-loader');
        
        if (loading) {
            fluxy.classList.add('excited');
            loader.style.display = 'block';
        } else {
            fluxy.classList.remove('excited');
            loader.style.display = 'none';
        }
    }

    function appendMessage(role, content) {
        const container = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = role === 'user' ? 'msg-user' : 'msg-fluxy';
        div.innerHTML = content.replace(/\n/g, '<br>');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>
<script>
    // ── LIBRERIA TEMPLATES (Dati dal tuo codice originale) ──────────
    const TEMPLATES = [
        {
            name: "Landing Page Moderna",
            desc: "Hero section, feature grid e form contatti con Tailwind.",
            prompt: "Crea una landing page moderna per una startup SaaS. Usa colori pastello, icone Lucide, una sezione Hero con un grande titolo, una griglia di servizi a 3 colonne e un footer elegante."
        },
        {
            name: "Dashboard Admin",
            desc: "Sidebar, statistiche con card e tabella dati.",
            prompt: "Crea una dashboard di amministrazione professionale. Includi una sidebar laterale, 4 card con statistiche in alto (Utenti, Vendite, ecc.) e una tabella principale con dati fittizi."
        },
        {
            name: "E-Commerce Semplice",
            desc: "Griglia prodotti con carrello e filtri.",
            prompt: "Crea un sito e-commerce di abbigliamento. Griglia di prodotti con immagini placeholder, prezzi, bottone 'Aggiungi al carrello' e una barra di navigazione con l'icona del carrello."
        }
    ];

    function openTemplates() {
        const grid = document.getElementById('template-grid');
        grid.innerHTML = TEMPLATES.map(t => `
            <div class="card p-5 hover:border-mint transition cursor-pointer group" onclick="applyTemplate('${t.name}')">
                <div class="flex justify-between items-start mb-3">
                    <div class="p-2 bg-mint/10 text-mint rounded-lg group-hover:bg-mint group-hover:text-white transition">
                        <i data-lucide="layout-template"></i>
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase">Ready to use</span>
                </div>
                <h3 class="font-bold mb-1">${t.name}</h3>
                <p class="text-xs text-gray-500">${t.desc}</p>
            </div>
        `).join('');
        document.getElementById('templates-modal').style.display = 'flex';
        lucide.createIcons();
    }

    function closeTemplates() { document.getElementById('templates-modal').style.display = 'none'; }

    function applyTemplate(name) {
        const t = TEMPLATES.find(x => x.name === name);
        if (t) {
            document.getElementById('user-input').value = t.prompt;
            closeTemplates();
            handleMainSend(); // Avvia la generazione automatica
        }
    }

    // ── EXPORT & DEPLOY (Logica JSZip) ──────────────────────────────
    async function openDeploy() {
        if (!state.currentCode) {
            alert("Genera prima qualcosa!");
            return;
        }
        
        // Effetto coriandoli per festeggiare il deploy
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#4ECDC4', '#9B8FE8', '#FF6B6B']
        });

        const zip = new JSZip();
        // Aggiungiamo il file principale
        zip.file("index.html", state.currentCode);
        
        // Aggiungiamo un file README (come nei progetti pro)
        zip.file("README.txt", "Progetto generato con Nextly AI\nData: " + new Date().toLocaleString());

        const content = await zip.generateAsync({type:"blob"});
        const url = window.URL.createObjectURL(content);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${state.projectName.replace(/\s+/g, '_')}_nextly.zip`;
        a.click();
        
        appendMessage('fluxy', "🚀 **Deploy completato!** Ho preparato il pacchetto ZIP con il tuo codice. Puoi caricarlo su Vercel, Netlify o GitHub.");
    }

    // ── IMPOSTAZIONI & FEEDBACK (EmailJS) ───────────────────────────
    function openSettings() {
        document.getElementById('set-proj-name').value = state.projectName;
        document.getElementById('set-sb-key').value = CONFIG.SB_KEY;
        document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
        state.projectName = document.getElementById('set-proj-name').value;
        CONFIG.SB_KEY = document.getElementById('set-sb-key').value;
        document.getElementById('main-project-name').value = state.projectName;
        localStorage.setItem('nx_proj_name', state.projectName);
        closeSettings();
        appendMessage('fluxy', "Impostazioni salvate con successo! ✨");
    }

    function openFeedback() {
        const f = prompt("Cosa ne pensi di Nextly? Scrivi qui il tuo feedback:");
        if (f) {
            // Logica EmailJS (Assicurati di averla configurata su emailjs.com come nel vecchio codice)
            emailjs.send("service_id", "template_id", {
                project: state.projectName,
                message: f,
                date: new Date().toISOString()
            }).then(() => {
                alert("Grazie! Feedback inviato a Fluxy.");
            });
        }
    }

    // ── UI UTILS ────────────────────────────────────────────────────
    function toggleTheme() {
        const root = document.getElementById('html-root');
        CONFIG.THEME = CONFIG.THEME === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', CONFIG.THEME);
    }

    function resizePreview(mode) {
        const wrap = document.getElementById('preview-wrap');
        if (mode === 'mobile') {
            wrap.style.maxWidth = '375px';
            wrap.style.margin = '0 auto';
            wrap.style.border = '12px solid #222';
            wrap.style.borderRadius = '40px';
        } else {
            wrap.style.maxWidth = '100%';
            wrap.style.margin = '0';
            wrap.style.border = 'none';
            wrap.style.borderRadius = 'var(--radius)';
        }
    }

    // Scorciatoie da tastiera (ESC per chiudere modali)
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeSettings();
            closeTemplates();
        }
    });
</script>
</body>
</html>
